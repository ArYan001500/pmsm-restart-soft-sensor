[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pmsm-restart-soft-sensor"
version = "1.0.0"
description = "Restarting rotor temperature soft sensors after estimator resets (CBP: calibrated background prior)"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scipy>=1.13", "pandas>=2.2", "scikit-learn>=1.5", "torch>=2.3", "matplotlib>=3.9"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
